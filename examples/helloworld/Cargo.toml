[package]
name = "helloworld-servo"
version = "0.1.0"
description = "Tauri helloworld example running on the experimental Servo runtime"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2.11", default-features = false, features = [
  "common-controls-v6",
] }
tauri-runtime-servo = { path = "../.." }
