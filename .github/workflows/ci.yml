name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: install Servo build dependencies (ubuntu only)
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libx11-dev libxkbcommon-x11-dev lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: servo-${{ matrix.platform.target }}

      - name: test
        run: cargo test --lib --target ${{ matrix.platform.target }}

      - name: lint
        run: cargo clippy --lib --target ${{ matrix.platform.target }} -- -D warnings

      - name: build helloworld example
        run: cargo build -p helloworld-servo --target ${{ matrix.platform.target }}
